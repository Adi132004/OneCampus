spring.application.name=OneCampus

# Port binding for Render / Cloud deployments (Render automatically injects PORT)
server.port=${PORT:8080}

# Database configuration (Reads Render env vars DB_HOST, DB_NAME, DB_USER, DB_PASSWORD or full connection URLs)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:ep-tiny-tooth-za4o1r2z.c-2.eu-west-2.aws.neon.tech}/${DB_NAME:neondb}?sslmode=require}}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_SPrJL12BOvAI}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

# JWT configuration (Reads Render env vars JWT_PRIVATE_KEY and JWT_PUBLIC_KEY)
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.public-key=${JWT_PUBLIC_KEY:}
jwt.access-token-ttl-minutes=15
jwt.refresh-token-ttl-days=7

logging.level.org.springframework.jdbc=DEBUG

# Cloudinary configuration (Reads Render env vars CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:qezpl0vj}
cloudinary.api-key=${CLOUDINARY_API_KEY:569391245154818}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:FRn6xR2PreKe6_v8Su_6aeBgh68}

# Increase multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB